services:
  db:
    image: pgvector/pgvector:pg16
    environment: {POSTGRES_DB: intellivault, POSTGRES_USER: intellivault, POSTGRES_PASSWORD: intellivault}
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
  api:
    build: .
    env_file: .env
    volumes: [uploads:/data/uploads]
    ports: ["8000:8000"]
    depends_on: [db,redis,ollama,clamav]
  worker:
    build: .
    command: celery -A app.celery_app.celery worker -l info
    env_file: .env
    volumes: [uploads:/data/uploads]
    depends_on: [db,redis]
  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    depends_on: [api]
  clamav:
    image: clamav/clamav:1.5.4-debian13-slim
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    restart: unless-stopped
  ollama:
    image: ollama/ollama:latest
    volumes: [ollama:/root/.ollama]
    ports: ["11434:11434"]
  ollama-pull:
    image: curlimages/curl:latest
    depends_on: [ollama]
    command: ["sh","-c","until curl -s http://ollama:11434/api/tags >/dev/null; do sleep 2; done; curl -s http://ollama:11434/api/pull -d '{\"model\":\"llama3.2:3b\",\"stream\":false}'"]
  prometheus:
    image: prom/prometheus:latest
    volumes: [./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana:latest
    environment: {GF_SECURITY_ADMIN_USER: admin, GF_SECURITY_ADMIN_PASSWORD: change-me}
    ports: ["3000:3000"]
volumes: {pgdata: {}, uploads: {}, ollama: {}, clamav-data: {}}
